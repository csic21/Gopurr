[package]
name = "gopurr-nsh-windows"
version = "0.6.23"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"

[[bin]]
name = "Gopurr"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3" }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }
libloading = "0.8.9"
log = "0.4"
serde_json = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
