name: Windows NSH acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'native_*.go'
      - 'main.go'
      - 'cmd/gopurr-bridge/**'
      - 'internal/nativehost/**'
      - 'scripts/**'
      - '.github/workflows/windows-nsh.yml'
permissions:
  contents: read
jobs:
  windows-nsh:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GOPATH: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/mod
      GOCACHE: ${{ github.workspace }}/.cache/build
      GOFLAGS: -tags=with_gvisor
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/cargo
            .cache/cargo-target
            .cache/nsh-windows
            .cache/rust-license-texts
            .cache/build
            .cache/mod
          key: windows-nsh-${{ runner.os }}-${{ hashFiles('native/windows/Cargo.lock', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: windows-nsh-${{ runner.os }}-
      - name: Configure short session paths and Rust
        shell: pwsh
        run: |
          New-Item C:/gp-tmp -ItemType Directory -Force | Out-Null
          "TEMP=C:/gp-tmp" >> $env:GITHUB_ENV
          "TMP=C:/gp-tmp" >> $env:GITHUB_ENV
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - name: Test Windows migration, authentication and backend
        env:
          CGO_ENABLED: '0'
        run: go test -v . ./internal/nativehost -timeout=5m
      - name: Build actual NSH Windows application
        shell: pwsh
        run: ./scripts/build-native-windows.ps1
      - name: Verify the actual Windows C ABI
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '1'
          $env:CC = @('C:/msys64/mingw64/bin/gcc.exe','C:/mingw64/bin/gcc.exe','C:/msys64/ucrt64/bin/gcc.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $env:CC) { $env:CC = (Get-Command gcc -ErrorAction Stop).Source }
          go test -v ./cmd/gopurr-bridge -timeout=5m
          if ($LASTEXITCODE) { throw 'Windows C ABI tests failed' }
      - name: Build compatible per-user installer
        shell: pwsh
        run: ./scripts/package-native-windows.ps1
      - name: Verify installed migration, protocols and graceful uninstall
        shell: pwsh
        run: ./scripts/test-native-windows-installer.ps1
      - name: Verify real core, Wintun, service and proxy recovery
        env:
          CGO_ENABLED: '0'
        shell: pwsh
        run: |
          go run ./scripts/smoke -binary bin/native/windows-amd64/gopurr-desktop.exe
          if ($LASTEXITCODE) { throw 'Native backend real-core smoke failed' }
          go run ./scripts/smoke-windows -binary bin/native/windows-amd64/gopurr-desktop.exe
          if ($LASTEXITCODE) { throw 'Native backend service/Wintun/proxy smoke failed' }
      - name: Render Windows pages, navigation, editors and dialogs
        shell: pwsh
        run: |
          $nsh = "$pwd/.cache/nsh-windows/nsh/bin/nsh.exe"
          & $nsh test native/ui
          if ($LASTEXITCODE) { throw 'NSH interaction tests failed' }
          foreach ($steps in @('desktop-render','desktop-collapsed-pages','desktop-dialogs','desktop-editors','desktop-editors-large')) {
            Get-Content "native/ui/$steps.steps.js" -Raw | & $nsh test native/ui/WindowsDesktopPreview.tsx --target windows
            if ($LASTEXITCODE) { throw "Windows UI render failed: $steps" }
          }
      - name: Verify production-signed legacy to NSH update
        env:
          CGO_ENABLED: '0'
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:MYGO_UPDATER_PRIVATE_KEY) { throw 'Production signing secret is required for Windows acceptance' }
          go run ./scripts/package-native-windows -app bin/native/windows-amd64 -out dist/native-windows-amd64 -sign -key-env MYGO_UPDATER_PRIVATE_KEY -notes docs/release-notes.md
          if ($LASTEXITCODE) { throw 'Production signing failed' }
          go run ./scripts/verify-update -artifacts dist/native-windows-amd64
          if ($LASTEXITCODE) { throw 'Production-key legacy update verification failed' }
      - name: Verify actual NSH old-data migration and subsequent update
        env:
          CGO_ENABLED: '0'
          GOPURR_NATIVE_WINDOWS_TEST_APP: ${{ github.workspace }}/bin/native/windows-amd64
        run: go test -v ./scripts/package-native-windows -run '^TestWindowsNativeMigrationRoundtrip$' -count=1 -timeout=20m
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-nsh-acceptance
          path: |
            bin/native/windows-amd64
            dist/native-windows-amd64
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-nsh-screenshots
          path: native/ui/screenshots/*.png
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: |
            .cache/cargo
            .cache/cargo-target
            .cache/nsh-windows
            .cache/rust-license-texts
            .cache/build
            .cache/mod
          key: windows-nsh-${{ runner.os }}-${{ hashFiles('native/windows/Cargo.lock', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
