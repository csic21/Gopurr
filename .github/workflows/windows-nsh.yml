name: Windows NSH acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'native_*.go'
      - 'main.go'
      - 'cmd/gopurr-bridge/**'
      - 'internal/nativehost/**'
      - 'scripts/**'
      - '.github/workflows/windows-nsh.yml'
permissions:
  contents: read
jobs:
  windows-nsh:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GOPATH: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/mod
      GOCACHE: ${{ github.workspace }}/.cache/build
      GOFLAGS: -tags=with_gvisor
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/cargo
            .cache/cargo-target
            .cache/nsh-windows
            .cache/build
            .cache/mod
          key: windows-nsh-${{ runner.os }}-${{ hashFiles('native/windows/Cargo.lock', 'go.sum') }}
          restore-keys: windows-nsh-${{ runner.os }}-
      - name: Configure short session paths and Rust
        shell: pwsh
        run: |
          New-Item C:/gp-tmp -ItemType Directory -Force | Out-Null
          "TEMP=C:/gp-tmp" >> $env:GITHUB_ENV
          "TMP=C:/gp-tmp" >> $env:GITHUB_ENV
          rustup toolchain install 1.93.1 --profile minimal
          rustup override set 1.93.1
      - name: Test Windows migration, authentication and backend
        env:
          CGO_ENABLED: '0'
        run: go test -v ./internal/nativehost ./cmd/gopurr-bridge ./internal/app -timeout=20m
      - name: Build actual NSH Windows application
        shell: pwsh
        run: ./scripts/build-native-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-nsh-acceptance
          path: |
            bin/native/windows-amd64
            native/ui/screenshots/*.png
          retention-days: 7
