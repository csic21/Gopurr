name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-nsh:
    uses: ./.github/workflows/windows-nsh.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}

  android:
    uses: ./.github/workflows/android.yml
    with:
      release: true
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin/arm64
            target: darwin-arm64
          - os: windows-latest
            platform: windows/amd64
            target: windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GOPATH: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/mod
      GOCACHE: ${{ github.workspace }}/.cache/build
      CGO_ENABLED: '0'
      GOFLAGS: -tags=with_gvisor
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: runner.os == 'Windows'
        with:
          path: |
            .cache/cargo
            .cache/cargo-target
            .cache/nsh-windows
            .cache/rust-license-texts
            .cache/build
            .cache/mod
          key: windows-nsh-${{ runner.os }}-${{ hashFiles('native/windows/Cargo.lock', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}-release
          restore-keys: windows-nsh-${{ runner.os }}-
      - name: Use short temporary paths for Windows Unix sockets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item C:\gp-tmp -ItemType Directory -Force | Out-Null
          "TEMP=C:\gp-tmp" >> $env:GITHUB_ENV
          "TMP=C:\gp-tmp" >> $env:GITHUB_ENV
      - name: Validate tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
      - name: Test
        # Keep the complete screenshot matrix on shared macOS runners.
        run: go test -timeout=20m ./...
      - name: Check reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build installer and signed update
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: go run ./scripts/release -release -version "$RELEASE_TAG" -platform "$PLATFORM"
      - name: Windows native backend real-core smoke test
        if: runner.os == 'Windows'
        run: go run ./scripts/smoke -binary bin/windows-amd64/gopurr-desktop.exe
      - name: Windows service and Wintun smoke test
        if: runner.os == 'Windows'
        run: go run ./scripts/smoke-windows -binary bin/windows-amd64/gopurr-desktop.exe
      - name: Verify native macOS migration and subsequent update
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: '1'
          GOPURR_NATIVE_PACKAGE_TEST_APP: ${{ github.workspace }}/bin/darwin-arm64/Gopurr.app
        run: go test -v ./scripts/package-native-update -run '^TestNativeDesktopMigrationRoundtrip$' -count=1 -timeout=12m
      - name: Verify signed update from a disposable old app
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: go run ./scripts/verify-update -artifacts "dist/$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && runner.os == 'Windows'
        with:
          path: |
            .cache/cargo
            .cache/cargo-target
            .cache/nsh-windows
            .cache/rust-license-texts
            .cache/build
            .cache/mod
          key: windows-nsh-${{ runner.os }}-${{ hashFiles('native/windows/Cargo.lock', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}-release

  publish:
    needs: [build, android, windows-nsh]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Assemble complete release
        working-directory: dist
        shell: bash
        run: |
          test -s "gopurr-${RELEASE_TAG#v}-arm64.dmg"
          test -s "gopurr-setup-${RELEASE_TAG#v}-amd64.exe"
          test -s "gopurr-${RELEASE_TAG#v}-android-arm64-v8a.apk"
          test -s "gopurr-${RELEASE_TAG#v}-android-x86_64.apk"
          test -s update-darwin-arm64.json
          test -s update-windows-amd64.json
          test -s update-native-darwin-arm64.json
          test -s update-native-windows-amd64.json
          cmp -s update-darwin-arm64.json update-native-darwin-arm64.json
          cmp -s update-windows-amd64.json update-native-windows-amd64.json
          sha256sum -- *.dmg *.exe *.apk *.tar.gz *.json > SHA256SUMS
      - name: Publish after all platforms succeed
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/release-draft; then
            if [[ "$(cat /tmp/release-draft)" != true ]]; then
              echo "Release is already public; preserving its immutable assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Gopurr $RELEASE_TAG" --generate-notes --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
