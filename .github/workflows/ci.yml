name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    uses: ./.github/workflows/android.yml

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOPATH: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/mod
      GOCACHE: ${{ github.workspace }}/.cache/build
      CGO_ENABLED: '0'
      GOFLAGS: -tags=with_gvisor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Use short temporary paths for Windows Unix sockets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item C:\gp-tmp -ItemType Directory -Force | Out-Null
          "TEMP=C:\gp-tmp" >> $env:GITHUB_ENV
          "TMP=C:\gp-tmp" >> $env:GITHUB_ENV
      - name: Test
        # The full theme/navigation/window screenshot matrix exceeds Go's
        # default 10-minute package timeout on shared macOS runners.
        run: go test -timeout=20m ./...
      - name: Check reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build
        run: go build -o bin/Gopurr${{ runner.os == 'Windows' && '.exe' || '' }} .
      - name: Isolated real-core traffic smoke test
        run: go run ./scripts/smoke -binary bin/Gopurr${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Windows service and Wintun smoke test
        if: runner.os == 'Windows'
        run: go run ./scripts/smoke-windows -binary bin/Gopurr.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots-${{ runner.os }}
          path: docs/render-*.png
          retention-days: 7

  windows-build-cache:
    # Release tags can restore caches from the default branch, but cannot
    # populate them for later tags. Keep the expensive NSH dependency build
    # warm on main so each release only rebuilds the application crates.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
      LIBCLANG_PATH: C:/Program Files/LLVM/bin
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            .cache/cargo
            .cache/cargo-target
          key: windows-cargo-${{ runner.os }}-${{ hashFiles('native/windows/Cargo.lock', 'native/windows/Cargo.toml', 'native/windows/build.rs') }}
          restore-keys: windows-cargo-${{ runner.os }}-
      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - name: Build release dependencies
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path native/windows/Cargo.toml
          if ($LASTEXITCODE) { throw 'Warm Windows Rust release build failed' }
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: success() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            .cache/cargo
            .cache/cargo-target
          key: windows-cargo-${{ runner.os }}-${{ hashFiles('native/windows/Cargo.lock', 'native/windows/Cargo.toml', 'native/windows/build.rs') }}
